[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "isQHung", email = "testkiller011@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "cryptography>=50.0.2",
    "dnslib>=0.9.26",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pystray>=0.19.5",
    "pywebview>=5.0",
    "pywin32>=312 ; sys_platform == 'win32'",
    "websockets>=17.2",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
